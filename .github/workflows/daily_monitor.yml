name: Daily Paper Signal Monitor

on:
  workflow_dispatch:
  schedule:
    # UTC windows: pre-market, regular session, close, and overnight.
    # GitHub Actions may delay scheduled jobs by a few minutes.
    - cron: "0 13 * * 1-5"
    - cron: "0 17 * * 1-5"
    - cron: "0 21 * * 1-5"
    - cron: "0 1 * * 2-6"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh reverse-split universe
        env:
          BUSINESSQUANT_API_KEY: ${{ secrets.BUSINESSQUANT_API_KEY }}
        run: python reverse_split_source.py
      - name: Scan daily paper signals
        run: python daily_signal_scanner.py
      - name: Validate monitor outputs
        run: |
          python -m py_compile daily_signal_scanner.py reverse_split_source.py
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ["reverse_split_candidates.json", "daily_signals.json", "paper_signal_history.json"]:
              p = Path(name)
              assert p.exists() and p.stat().st_size > 0, name
          x = json.loads(Path("daily_signals.json").read_text(encoding="utf-8"))
          for key in ["ready_entry", "almost_ready", "follow_up", "watchlist"]:
              assert key in x["summary"], key
          for key in ["ready_entry", "almost_ready", "follow_up", "watchlist"]:
              assert key in x, key
          print(x["summary"])
          PY
      - name: Commit monitor data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reverse_split_candidates.json daily_signals.json paper_signal_history.json
          git diff --cached --quiet || git commit -m "Update daily paper signal monitor"
          git push
