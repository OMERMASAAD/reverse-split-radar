name: Reverse Split Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1-5"
    - cron: "0 17 * * 1-5"
    - cron: "0 20 * * 1-5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: تجهيز Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل مصدر التقسيمات
        env:
          BUSINESSQUANT_API_KEY: ${{ secrets.BUSINESSQUANT_API_KEY }}
        run: python reverse_split_source.py

      - name: التأكد من قائمة الأسهم
        run: |
          echo "📂 فحص ملف المرشحين..."
          ls -la
          echo ""
          echo "📄 محتوى قائمة المرشحين:"
          cat reverse_split_candidates.json

      - name: تشغيل الرادار
        run: python scanner.py

      - name: تشغيل Strategy Scanner
        run: python strategy_scanner.py

      - name: التأكد من بيانات الداشبورد
        run: |
          echo "📊 فحص dashboard_data.json..."
          ls -lh dashboard_data.json
          echo ""
          echo "عدد الأسهم:"
          python -c "import json; d=json.load(open('dashboard_data.json', encoding='utf-8')); print(len(d.get('stocks', [])))"

      - name: حفظ بيانات الداشبورد
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_data.json
          git diff --cached --quiet || git commit -m "Update dashboard data"
          git push
