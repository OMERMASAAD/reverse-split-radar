name: Reverse Split Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1-5"
    - cron: "0 17 * * 1-5"
    - cron: "0 20 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: تجهيز Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل مصدر التقسيمات
        env:
          BUSINESSQUANT_API_KEY: ${{ secrets.BUSINESSQUANT_API_KEY }}
        run: python reverse_split_source.py

      - name: التأكد من قائمة الأسهم
        run: |
          echo "📂 فحص ملف المرشحين..."
          ls -la
          echo ""
          echo "📄 محتوى قائمة المرشحين:"
          cat reverse_split_candidates.json

      - name: تشغيل الرادار
        run: python scanner.py

      - name: تشغيل Strategy Scanner
        run: python strategy_scanner.py
