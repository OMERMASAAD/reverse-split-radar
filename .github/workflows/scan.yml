name: Reverse Split Scanner

on:
  workflow_dispatch:
  schedule:
    # ============================================================
    # التحليل اليومي الكامل (Score / Core / Rating) - مرة واحدة
    # فقط بعد إغلاق السوق الأمريكي فعليًا، لضمان أن الشمعة اليومية
    # اكتملت قبل حساب RSI/MACD/MA وغيرها.
    #
    # إغلاق سوق نيويورك 4:00 عصرًا بتوقيت نيويورك:
    #   = 20:00 UTC تقريبًا (بالتوقيت الصيفي EDT، مثل الآن أغسطس)
    #   = 21:00 UTC تقريبًا (بالتوقيت الشتوي EST، من نوفمبر تقريبًا)
    #   = 23:00 / 00:00 بتوقيت السعودية (GMT+3) على التوالي
    #
    # التشغيل الأول: 20:30 UTC (بعد الإغلاق بنصف ساعة كهامش أمان)
    # التشغيل الثاني: نسخة احتياطية بعد ساعة، تحسبًا لتأخير GitHub
    # المعروف أحيانًا في الجداول المجانية (Scheduled Actions delay).
    # كلا التشغيلين آمنان: git commit لا يحدث إلا لو تغيّرت البيانات.
    # ============================================================
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: تجهيز Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل مصدر التقسيمات
        env:
          BUSINESSQUANT_API_KEY: ${{ secrets.BUSINESSQUANT_API_KEY }}
        run: python reverse_split_source.py

      - name: التأكد من قائمة الأسهم
        run: |
          echo "📂 فحص ملف المرشحين..."
          ls -la
          echo ""
          echo "📄 محتوى قائمة المرشحين:"
          cat reverse_split_candidates.json

      - name: تشغيل الرادار
        run: python scanner.py

      - name: تشغيل Strategy Scanner
        run: python strategy_scanner.py

      - name: التأكد من بيانات الداشبورد
        run: |
          echo "📊 فحص dashboard_data.json..."
          ls -lh dashboard_data.json
          echo ""
          echo "عدد الأسهم:"
          python -c "import json; d=json.load(open('dashboard_data.json', encoding='utf-8')); print(len(d.get('stocks', [])))"

      - name: تشغيل السجل التاريخي ودراسة الحالات
        run: python history_tracker.py

      - name: التأكد من ملفات السجل التاريخي
        run: |
          echo "📚 فحص stock_history.json..."
          ls -lh stock_history.json case_study.json

      - name: حفظ بيانات الداشبورد والسجل التاريخي
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_data.json stock_history.json case_study.json
          git diff --cached --quiet || git commit -m "Update dashboard data and history tracking"
          git push
