name: Historical Reverse-Split Research

on:
  workflow_dispatch:
  schedule:
    - cron: "20 23 * * 1-5"

permissions:
  contents: write

jobs:
  historical-study:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh reverse-split universe (180 days)
        env:
          BUSINESSQUANT_API_KEY: ${{ secrets.BUSINESSQUANT_API_KEY }}
        run: python reverse_split_source.py

      - name: Run historical study
        run: python historical_study.py

      - name: Run explosion lifecycle and 4-hour analysis
        run: python explosion_lifecycle.py

      - name: Validate outputs
        run: |
          python -m py_compile historical_study.py reverse_split_source.py
          python - <<'PY'
          import json
          from pathlib import Path
          required = ["historical_study.json", "historical_analysis.json", "historical_cases.json", "historical_features.csv", "explosion_lifecycle.json", "explosion_lifecycle.csv", "strategy_backtest.json", "strategy_report.md"]
          for name in required:
              p = Path(name)
              assert p.exists() and p.stat().st_size > 0, name
          study = json.loads(Path("historical_study.json").read_text(encoding="utf-8"))
          assert study["universe"]["lookback_calendar_days"] == 180
          assert study["universe"]["no_age_filter"] is True
          print("outputs valid", study["sample"])
          PY

      - name: Commit research outputs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical_study.json historical_analysis.json historical_cases.json historical_features.csv explosion_lifecycle.json explosion_lifecycle.csv strategy_backtest.json strategy_report.md reverse_split_candidates.json
          git diff --cached --quiet || git commit -m "Update historical reverse-split research"
          git push
