name: Reverse Split Scanner

on:
  workflow_dispatch:
  schedule:
    # ============================================================
    # التحليل الكامل (Score / Core / Rating / حالة السيولة) أصبح
    # يعمل كل ساعة تقريبًا طوال فترة التداول الأمريكي، بدل مرتين
    # يوميًا فقط - بناءً على طلب متابعة أدق للأسهم.
    #
    # ⚠️ ملاحظة منهجية مهمة (شفافية، بدون تعديل صامت):
    # التشغيلات أثناء اليوم (قبل إغلاق السوق) تستخدم شمعة يومية لم
    # تكتمل بعد - يعني RSI/MACD/Score قد تتغيّر مع تقدم اليوم وتستقر
    # فقط في تشغيل ما بعد الإغلاق (آخر تشغيل بالجدول أدناه). هذا
    # متوقع وطبيعي، وهو الثمن مقابل رؤية شبه لحظية بدل الانتظار
    # لنهاية اليوم فقط.
    #
    # التوقيتات بالتوقيت الصيفي الحالي (EDT):
    #   13:30 UTC = 16:30 السعودية - افتتاح تقريبي
    #   14:30 → 19:30 UTC كل ساعة = 17:30 → 22:30 السعودية
    #   20:30 UTC = 23:30 السعودية - بعد الإغلاق مباشرة (الأدق)
    # ============================================================
    - cron: "30 13-20 * * 1-5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: تجهيز Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل مصدر التقسيمات
        env:
          BUSINESSQUANT_API_KEY: ${{ secrets.BUSINESSQUANT_API_KEY }}
        run: python reverse_split_source.py

      - name: التأكد من قائمة الأسهم
        run: |
          echo "📂 فحص ملف المرشحين..."
          ls -la
          echo ""
          echo "📄 محتوى قائمة المرشحين:"
          cat reverse_split_candidates.json

      - name: تشغيل الرادار
        run: python scanner.py

      - name: تشغيل Strategy Scanner
        run: python strategy_scanner.py

      - name: التأكد من بيانات الداشبورد
        run: |
          echo "📊 فحص dashboard_data.json..."
          ls -lh dashboard_data.json
          echo ""
          echo "عدد الأسهم:"
          python -c "import json; d=json.load(open('dashboard_data.json', encoding='utf-8')); print(len(d.get('stocks', [])))"

      - name: تشغيل السجل التاريخي ودراسة الحالات
        run: python history_tracker.py

      - name: التأكد من ملفات السجل التاريخي
        run: |
          echo "📚 فحص stock_history.json..."
          ls -lh stock_history.json case_study.json

      - name: حفظ بيانات الداشبورد والسجل التاريخي
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_data.json stock_history.json case_study.json pattern_analysis.json reverse_split_candidates.json explosion_analysis.json
          git diff --cached --quiet || git commit -m "Update dashboard data and history tracking"
          git push
